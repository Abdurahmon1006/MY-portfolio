{% extends 'base.html' %}

<script>
function matnniNusxala(id) {
  var matn = document.getElementById(id).innerText;
  var input = document.createElement("textarea");
  input.value = matn;
  document.body.appendChild(input);
  input.select();
  document.execCommand("copy");
  document.body.removeChild(input);
  alert("Matn nusxalandi: " + matn);
}
</script>

.section-container,
.section-container h1,
.section-container h2,
.section-container h3,
.section-container h4,
.section-container h5,
.section-container h6,
.section-container p,
.section-container li,

.section-container textarea,

.section-container select,
.section-container option,
.section-container blockquote,
.section-container .alert,
.section-container .btn,
.section-container .fa,
.section-container .fa-icon {

  border-color: #007BFF !important;

/* Input, textarea va select shaffof va ko‘k border */
.section-container input,
.section-container textarea,
.section-container select {
